# --- 0. Visual Settings ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"

# Monitor for bells and activity in background windows
set-window-option -g monitor-bell on
set-window-option -g monitor-activity on
set-option -g visual-bell on
set-option -g visual-activity on
bind z set-option status

# --- 1. General Settings ---
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g status-interval 2
set -g history-limit 50000
set -sg escape-time 0
set-window-option -g automatic-rename on
set-option -g renumber-windows on
set-option -g status-position bottom
set-option -g focus-events on
bind r source-file ~/.config/tmux/tmux.conf \; display "󰑓 Config Reloaded!  "

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Default shell
set-option -g default-shell "/bin/zsh"

# --- 2. Key Bindings ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


# Slide windows left and right using Prefix + < and Prefix + >
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Quick window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


# --- 3. Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-censible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'azorng/tmux-smooth-scroll'
set -g @plugin 'jtmcginty/tmux-session-dots'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'wfxr/tmux-fzf-url#legacy'

# --- floax settings ---
set -g @floax-bind-menu 'P'

set -g @floax-width '80%'
set -g @floax-height '80%'

set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-change-path 'true'
set -g @floax-session-name 'floax-terminal'
set -g @floax-title 'floax'

# --- 4. Appearance  ---
set -g @gruvbox-tmux_theme "medium"
set -g @gruvbox-tmux_transparent 1
set -g @gruvbox-tmux_window_id_style arabic
set -g @gruvbox-tmux_pane_id_style super
set -g @gruvbox-tmux_zoom_id_style dsquare
set -g @gruvbox-tmux_show_battery_widget 1
set -g @gruvbox-tmux_battery_name "BAT0"
set -g @gruvbox-tmux_battery_low_threshold 25
run-shell "~/.config/tmux/bimbok-theme/theme.tmux"

set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'

set -g @smooth-scroll-easing "quad"
set -g @smooth-scroll-mouse "true"

set -gq allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM



# --- 6. Initialize ---
run '~/.tmux/plugins/tpm/tpm'


