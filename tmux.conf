# --- 0. Visual Settings ---
# Ensure tmux uses 256 colors and supports True Color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# --- 1. General Settings ---
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set-window-option -g automatic-rename on
set-option -g renumber-windows on
set-option -g status-position bottom

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Default shell
set-option -g default-shell "/bin/zsh"

# --- 2. Key Bindings ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind g popup -d "#{pane_current_path}" -E -w 80% -h 70%

# Slide windows left and right using Prefix + < and Prefix + >
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# --- 3. Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-censible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin "https://gitlab.com/motaz-shokry/gruvbox-tmux"
set -g @plugin 'azorng/tmux-smooth-scroll'
set -g @plugin 'jtmcginty/tmux-session-dots'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# --- 4. Appearance  ---
set -g @gruvbox-tmux_theme "medium"
set -g @gruvbox-tmux_transparent 1
set -g @gruvbox-tmux_window_id_style arabic
set -g @gruvbox-tmux_pane_id_style super
set -g @gruvbox-tmux_zoom_id_style dsquare
set -g @gruvbox-tmux_show_battery_widget 1
set -g @gruvbox-tmux_battery_name "BAT0"
set -g @gruvbox-tmux_battery_low_threshold 25

set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'


set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM



# --- 6. Initialize ---
run '~/.tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

